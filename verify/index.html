const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw){
  const k0 = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(D.salt), iterations:D.iter, hash:"SHA-256"}, k0, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, k, b64(D.ct));
  document.getElementById("app").innerHTML = new TextDecoder().decode(pt);
  document.getElementById("f").style.display = "none";
}
document.getElementById("f").addEventListener("submit", async e => { e.preventDefault();
  const pw = document.getElementById("pw").value;
  try { await open_(pw); try { if (document.getElementById("keep").checked) localStorage.setItem("vp", pw); } catch(_){} }
  catch(_) { document.getElementById("err").style.display = "block"; } });
(async () => { let pw = null; try { pw = localStorage.getItem("vp"); } catch(_){}
  if (pw) { try { await open_(pw); } catch(_) { try { localStorage.removeItem("vp"); } catch(__){} } } })();
